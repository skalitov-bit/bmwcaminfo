name: Build and verify SpeedCAM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bmw-speed-camera-warning/**'
      - '.github/workflows/speed-camera-release.yml'
  push:
    branches: [main]
    paths:
      - 'bmw-speed-camera-warning/**'
      - '.github/workflows/speed-camera-release.yml'

# Validation only. This workflow cannot upload release assets, update tags,
# change Latest, write the Store catalog or regenerate/publish camera databases.
permissions:
  contents: read

concurrency:
  group: speedcam-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '8.17.0'
      - name: Keep the MGU-compatible Node.js path
        run: echo "NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CI safeguards
        run: python -m unittest discover -s bmw-speed-camera-warning/tests -p 'test_ci_pipeline.py' -v
      - name: Restore verified build inputs
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: speedcam-inputs-${{ runner.os }}-${{ hashFiles('bmw-speed-camera-warning/tools/ci-inputs.json', 'bmw-speed-camera-warning/tools/build-inputs.json') }}
      - name: Build current source and verify packages
        run: python bmw-speed-camera-warning/tools/ci_pipeline.py build --node8 "$NODE8"
      - name: Save build and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedcam-build-${{ github.run_id }}
          path: |
            ci-output/build/*.mgu
            ci-output/build/*.tgz
            ci-output/build/*.json
            ci-output/build/store/*.json
            ci-output/build/store/*.txt
          if-no-files-found: error
          retention-days: 14

  separate-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '8.17.0'
      - name: Verify separate regional maps and offline lifecycle
        run: python bmw-speed-camera-warning/tools/ci_pipeline.py maps
      - name: Save map verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedcam-maps-${{ github.run_id }}
          path: ci-output/maps/CHECKS.json
          if-no-files-found: error
          retention-days: 14
